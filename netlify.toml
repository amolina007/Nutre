[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Canonical development URL; proxy upstream uses the Netlify hostname.
[[redirects]]
from = "https://dev.nutre.convergenciaaura.cl/*"
to = "https://dev.convergenciaaura.cl/nutre/:splat"
status = 301
force = true
